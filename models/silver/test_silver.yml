
models:
  - name: int_customers
    data_tests:
      - silver_count:
          arguments: 
            sourcemodel: source('analytics', 'customers_flat')
            destinationmodel: ref('int_customers')
      - silver_row_level_with_id: # source to target
          arguments:
            column_name: customer_id
            sourcemodel: source('analytics', 'customers_flat')
            destinationmodel: ref('int_customers')
      - silver_row_level_with_id: # target to source
          arguments:
            column_name: customer_id
            sourcemodel: ref('int_customers')
            destinationmodel: source('analytics', 'customers_flat')

    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null 
      - name: loyalty_tier
        data_tests:
          - accepted_values:
              arguments: 
                values: ['platinum', 'gold', 'silver', 'bronze']
      - name: is_active
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]

  - name: int_orders
    data_tests:
      - silver_count:
          arguments: 
            sourcemodel: source('analytics', 'orders_flat')
            destinationmodel: ref('int_orders')
      - silver_row_level_with_id: # source to target
          arguments:
            column_name: line_item_id
            sourcemodel: source('analytics', 'orders_flat')
            destinationmodel: ref('int_orders')
      - silver_row_level_with_id: # target to source
          arguments:
            column_name: line_item_id
            sourcemodel: ref('int_orders')
            destinationmodel: source('analytics', 'orders_flat')

    columns:
      - name: line_item_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('int_customers')
                field: customer_id
      - name: product_id
        data_tests:
          - relationships:
              arguments: 
                to: ref('int_products')
                field: product_id

  - name: int_products
    data_tests:
      - silver_count:
          arguments: 
            sourcemodel: source('analytics', 'products_flat')
            destinationmodel: ref('int_products')
      - silver_row_level_with_id: # source to target
          arguments:
            column_name: product_id
            sourcemodel: source('analytics', 'products_flat')
            destinationmodel: ref('int_products')
      - silver_row_level_with_id: # target to source
          arguments:
            column_name: product_id
            sourcemodel: ref('int_products')
            destinationmodel: source('analytics', 'products_flat')

    columns:
      - name: product_id
        data_tests:
         - unique
         - not_null
      - name: category
        data_tests:
          - accepted_values:
              arguments: 
                values: ['Books','Toys','Clothing','Electronics','Home & Kitchen','Beauty','Sports','Grocery']
      - name: stock_status
        data_tests:
          - accepted_values:
              arguments: 
                values: [true, false]